<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Café Lua — do café da manhã ao café da madrugada, entregue onde você estiver." />
    <meta name="theme-color" content="#4B2995" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Café Lua · Coffee Delivery</title>
    <script>
      // Aplica o tema antes do React para evitar "flash" de cor (RF-14).
      ;(function () {
        try {
          var saved = JSON.parse(localStorage.getItem('coffee-delivery:theme'))
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          document.documentElement.style.backgroundColor = dark ? '#151219' : '#FAFAFA'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
